[Openmatb]
# Locale de la interfaz. Valores distribuidos: es_CO, en_EN y fr_FR.
language=es_CO

# Tema visual de la tarea. Valores admitidos: classic, cockpit.
# classic conserva la presentación histórica; cockpit usa instrumentos vectoriales oscuros.
visual_theme=classic

# En una configuración con varias pantallas, modifique este índice.
# Valor predeterminado: screen_index=0
screen_index=0

# Puede indicar una fuente diferente a la predeterminada.
# Déjelo vacío para usar la fuente predeterminada del sistema.
font_name=

# Modo de pantalla completa.
# Valor predeterminado: fullscreen=True
fullscreen=True

# Selección del escenario.
# Ejemplo: scenario_path=Parasuraman_et_al_1993/high_reliability_block.txt
scenario_path=

# Mostrar el número de sesión al iniciar.
display_session_number=True

# Ocultar el entorno MATB durante la pausa (teclas "P" o "Escape").
hide_on_pause=False

# Resaltar las áreas de interés (AOI) de los componentes.
# Si es True, se muestra un marco rojo y el nombre de cada componente.
highlight_aoi=False


# Límites verticales entre las áreas de las tareas.
# Modifíquelos únicamente si necesita cambiar la ubicación predeterminada.
# Valores predeterminados: top_bounds=[0.35, 0.85] | bottom_bounds=[0.30, 0.85]
top_bounds=[0.35, 0.85]
bottom_bounds=[0.30, 0.85]
