name: SMS verification

on:
  push:
    branches:
      - main
    paths:
      - "SMS/**"
      - ".github/workflows/sms-ci.yml"
  pull_request:
    paths:
      - "SMS/**"
      - ".github/workflows/sms-ci.yml"

permissions:
  contents: read

concurrency:
  group: sms-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SMS
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SMS/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run release verification
        run: npm run verify:all
      - name: Build disconnected transfer bundle
        run: npm run build:offline -- --output dist/offline-bundle
      - name: Verify disconnected transfer bundle
        run: npm run verify:offline -- --bundle dist/offline-bundle --no-network
