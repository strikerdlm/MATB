name: MATB research candidate verification

on:
  push:
    branches: [main]
    paths-ignore: ["SMS/**"]
  pull_request:
    paths-ignore: ["SMS/**"]

permissions:
  contents: read

concurrency:
  group: matb-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          path: MATB relocation ñ
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: MATB relocation ñ/requirements-dev.txt
      - run: python -m pip install --upgrade pip
        working-directory: MATB relocation ñ
      - run: python -m pip install -r requirements-dev.txt
        working-directory: MATB relocation ñ
      - name: Verify MATB integration and scientific contracts
        working-directory: MATB relocation ñ
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests -q -p no:cacheprovider --ignore=tests/suas --ignore=tests/liftoff --ignore=tests/documentation --junitxml=verification/contracts.xml
      - name: Verify public-core boundary
        working-directory: MATB relocation ñ
        run: python scripts/export_public_core.py --dry-run
      - name: Verify bilingual documentation
        working-directory: MATB relocation ñ
        run: python scripts/verify_documentation.py
      - name: Retain contract verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: contracts-${{ matrix.os }}
          path: MATB relocation ñ/verification
          retention-days: 14

  openmatb-runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: MATB relocation ñ/openmatb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          path: MATB relocation ñ
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: MATB relocation ñ/openmatb/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify OpenMATB runtime logic
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests -q -p no:cacheprovider --junitxml=../verification/native.xml
      - name: Retain native verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: native-${{ matrix.os }}
          path: MATB relocation ñ/verification
          retention-days: 14

  research-console:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          path: MATB relocation ñ
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: MATB relocation ñ/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: MATB relocation ñ
      - name: Prepare pinned descriptive replay wheels
        working-directory: MATB relocation ñ
        run: python tools/prepare_study_wheels.py .test-tmp/repeatable-study/descriptive-wheels
      - name: Backend core tests
        working-directory: MATB relocation ñ/webui/backend
        env:
          MATB_COMPONENTS: core
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider -p anyio.pytest_plugin
          --ignore=tests/test_liftoff_analysis_endpoint.py
          --ignore=tests/test_liftoff_completeness.py
          --ignore=tests/test_liftoff_endpoints.py
          --ignore=tests/test_liftoff_failures.py
          --ignore=tests/test_liftoff_models.py
          --ignore=tests/test_liftoff_system.py
          --ignore=tests/test_physiology_api.py
          --ignore=tests/test_physiology_runtime.py
          --ignore=tests/test_simulation_endpoints.py
          --ignore=tests/test_simulation_failures.py
          --ignore=tests/test_simulation_hub.py
          --ignore=tests/test_simulation_models.py
          --ignore=tests/test_simulation_runtime.py
          --ignore=tests/test_simulation_websocket_unit.py
          --junitxml=../../verification/backend-core.xml
      - name: Backend full component tests
        working-directory: MATB relocation ñ/webui/backend
        env:
          MATB_COMPONENTS: auto
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -p no:cacheprovider -p anyio.pytest_plugin --junitxml=../../verification/backend-full.xml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: MATB relocation ñ/webui/frontend/package-lock.json
      - run: npm ci
        working-directory: MATB relocation ñ/webui/frontend
      - run: npm test -- --reporter=default --reporter=junit --outputFile=../../verification/frontend.xml
        working-directory: MATB relocation ñ/webui/frontend
      - run: npm run lint
        working-directory: MATB relocation ñ/webui/frontend
      - run: npm run typecheck
        working-directory: MATB relocation ñ/webui/frontend
      - run: npm run build
        working-directory: MATB relocation ñ/webui/frontend
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        working-directory: MATB relocation ñ/webui/frontend
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        working-directory: MATB relocation ñ/webui/frontend
        run: npx playwright install chromium
      - name: Core browser verification
        working-directory: MATB relocation ñ/webui/frontend
        env:
          MATB_PYTHON: python
          MATB_SOURCE_COMMIT: ${{ github.sha }}
          MATB_SOURCE_DIRTY: "false"
        run: npm run test:e2e:core -- --fail-on-flaky-tests --output=test-results/core
      - name: Colombia geography and sUAS browser verification
        working-directory: MATB relocation ñ/webui/frontend
        env:
          MATB_PYTHON: python
          MATB_COMPONENTS: auto
          MATB_SOURCE_COMMIT: ${{ github.sha }}
          MATB_SOURCE_DIRTY: "false"
          MATB_E2E_TRAFFIC_FIXTURE: "1"
          MATB_E2E_REGION_CHECK: "1"
          PW_TEST_MATCH: "**/{geography,geography-assets,presentation}.spec.ts"
          PLAYWRIGHT_HTML_OUTPUT_DIR: "playwright-report/geography"
        run: npm run test:e2e -- --fail-on-flaky-tests --output=test-results/geography
      - name: Swarm production browser verification
        working-directory: MATB relocation ñ/webui/frontend
        env:
          MATB_PYTHON: python
          MATB_COMPONENTS: auto
        run: npm run test:e2e:swarm -- --fail-on-flaky-tests --output=test-results/swarm
      - name: Scientific evidence browser verification
        working-directory: MATB relocation ñ/webui/frontend
        env:
          MATB_PYTHON: python
          PW_TEST_MATCH: "**/evidence.spec.ts"
          PLAYWRIGHT_HTML_OUTPUT_DIR: "playwright-report/evidence"
        run: npm run test:e2e -- --fail-on-flaky-tests --output=test-results/evidence
      - name: Repeatable study participant browser verification
        working-directory: MATB relocation ñ/webui/frontend
        env:
          MATB_PYTHON: python
          MATB_COMPONENTS: auto
          PW_TEST_MATCH: "**/{study-registry,study-preparation,study-analysis,station,study-restore,participant-journey,frontend-predictability}.spec.ts"
          PLAYWRIGHT_HTML_OUTPUT_DIR: "playwright-report/repeatable-study"
        run: npm run test:e2e -- --fail-on-flaky-tests --output=test-results/repeatable-study
      - name: Actual browser zoom verification (Linux)
        if: runner.os == 'Linux'
        working-directory: MATB relocation ñ/webui/frontend
        env:
          MATB_PYTHON: python
          PW_TEST_MATCH: "**/browser-zoom.spec.ts"
          PLAYWRIGHT_HTML_OUTPUT_DIR: "playwright-report/zoom"
        run: npm run test:e2e -- --fail-on-flaky-tests --output=test-results/zoom
      - name: Retain browser verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: console-${{ matrix.os }}
          path: |
            MATB relocation ñ/verification
            MATB relocation ñ/webui/frontend/test-results
            MATB relocation ñ/webui/frontend/playwright-report
          retention-days: 14
      - name: Verify POSIX launchers from unrelated directory
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        env:
          MATB_PYTHON: python
          MATB_DATA_ROOT: ${{ runner.temp }}/MATB external data ñ
        run: |
          bash "$GITHUB_WORKSPACE/MATB relocation ñ/tests/scripts/test_suas_scripts.sh"
          bash "$GITHUB_WORKSPACE/MATB relocation ñ/scripts/test_suas_offline.sh"
      - name: Verify Windows launchers from unrelated directory
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        env:
          MATB_PYTHON: python
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\MATB relocation ñ\tests\windows\test_matb_launchers.ps1"
          & "$env:GITHUB_WORKSPACE\MATB relocation ñ\tests\windows\test_matb_relocation.ps1"
