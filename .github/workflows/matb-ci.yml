name: MATB research candidate verification

on:
  push:
    branches: [main]
    paths-ignore: ["SMS/**"]
  pull_request:
    paths-ignore: ["SMS/**"]

permissions:
  contents: read

concurrency:
  group: matb-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify MATB integration and scientific contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests -q -p no:cacheprovider --ignore=tests/suas --ignore=tests/liftoff --ignore=tests/documentation
      - name: Verify public-core boundary
        run: python scripts/export_public_core.py --dry-run
      - name: Verify bilingual documentation
        run: python scripts/verify_documentation.py

  openmatb-runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: openmatb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify OpenMATB runtime logic
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests -q -p no:cacheprovider

  research-console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Backend tests
        working-directory: webui/backend
        env:
          MATB_COMPONENTS: core
        run: >-
          python -m pytest -q -p no:cacheprovider
          --ignore=tests/test_liftoff_analysis_endpoint.py
          --ignore=tests/test_liftoff_completeness.py
          --ignore=tests/test_liftoff_endpoints.py
          --ignore=tests/test_liftoff_failures.py
          --ignore=tests/test_liftoff_models.py
          --ignore=tests/test_liftoff_system.py
          --ignore=tests/test_simulation_endpoints.py
          --ignore=tests/test_simulation_failures.py
          --ignore=tests/test_simulation_hub.py
          --ignore=tests/test_simulation_models.py
          --ignore=tests/test_simulation_runtime.py
          --ignore=tests/test_simulation_websocket_unit.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json
      - run: npm ci
        working-directory: webui/frontend
      - run: npm test
        working-directory: webui/frontend
      - run: npm run lint
        working-directory: webui/frontend
      - run: npm run typecheck
        working-directory: webui/frontend
      - run: npm run build
        working-directory: webui/frontend
      - name: Install Playwright Chromium
        working-directory: webui/frontend
        run: npx playwright install --with-deps chromium
      - name: Core browser verification
        working-directory: webui/frontend
        env:
          MATB_PYTHON: ${{ env.pythonLocation }}/bin/python
          MATB_SOURCE_COMMIT: ${{ github.sha }}
          MATB_SOURCE_DIRTY: "false"
        run: npm run test:e2e:core
