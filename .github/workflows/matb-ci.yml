name: MATB research candidate verification

on:
  push:
    branches: [main]
    paths-ignore: ["SMS/**"]
  pull_request:
    paths-ignore: ["SMS/**"]

permissions:
  contents: read

concurrency:
  group: matb-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: MATB relocation ñ
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: MATB relocation ñ/requirements-dev.txt
      - run: python -m pip install --upgrade pip
        working-directory: MATB relocation ñ
      - run: python -m pip install -r requirements-dev.txt
        working-directory: MATB relocation ñ
      - name: Verify MATB integration and scientific contracts
        working-directory: MATB relocation ñ
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests -q -p no:cacheprovider --ignore=tests/suas --ignore=tests/liftoff --ignore=tests/documentation
      - name: Verify public-core boundary
        working-directory: MATB relocation ñ
        run: python scripts/export_public_core.py --dry-run
      - name: Verify bilingual documentation
        working-directory: MATB relocation ñ
        run: python scripts/verify_documentation.py

  openmatb-runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: MATB relocation ñ/openmatb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: MATB relocation ñ
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: MATB relocation ñ/openmatb/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify OpenMATB runtime logic
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests -q -p no:cacheprovider

  research-console:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: MATB relocation ñ
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: MATB relocation ñ/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: MATB relocation ñ
      - name: Backend core tests
        working-directory: MATB relocation ñ/webui/backend
        env:
          MATB_COMPONENTS: core
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider -p anyio.pytest_plugin
          --ignore=tests/test_liftoff_analysis_endpoint.py
          --ignore=tests/test_liftoff_completeness.py
          --ignore=tests/test_liftoff_endpoints.py
          --ignore=tests/test_liftoff_failures.py
          --ignore=tests/test_liftoff_models.py
          --ignore=tests/test_liftoff_system.py
          --ignore=tests/test_physiology_api.py
          --ignore=tests/test_physiology_runtime.py
          --ignore=tests/test_simulation_endpoints.py
          --ignore=tests/test_simulation_failures.py
          --ignore=tests/test_simulation_hub.py
          --ignore=tests/test_simulation_models.py
          --ignore=tests/test_simulation_runtime.py
          --ignore=tests/test_simulation_websocket_unit.py
      - name: Backend full component tests
        working-directory: MATB relocation ñ/webui/backend
        env:
          MATB_COMPONENTS: auto
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -p no:cacheprovider -p anyio.pytest_plugin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: MATB relocation ñ/webui/frontend/package-lock.json
      - run: npm ci
        working-directory: MATB relocation ñ/webui/frontend
      - run: npm test
        working-directory: MATB relocation ñ/webui/frontend
      - run: npm run lint
        working-directory: MATB relocation ñ/webui/frontend
      - run: npm run typecheck
        working-directory: MATB relocation ñ/webui/frontend
      - run: npm run build
        working-directory: MATB relocation ñ/webui/frontend
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        working-directory: MATB relocation ñ/webui/frontend
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        working-directory: MATB relocation ñ/webui/frontend
        run: npx playwright install chromium
      - name: Core browser verification
        working-directory: MATB relocation ñ/webui/frontend
        env:
          MATB_PYTHON: python
          MATB_SOURCE_COMMIT: ${{ github.sha }}
          MATB_SOURCE_DIRTY: "false"
        run: npm run test:e2e:core
      - name: Verify POSIX launchers from unrelated directory
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        env:
          MATB_PYTHON: python
          MATB_DATA_ROOT: ${{ runner.temp }}/MATB external data ñ
        run: |
          bash "$GITHUB_WORKSPACE/MATB relocation ñ/tests/scripts/test_suas_scripts.sh"
          bash "$GITHUB_WORKSPACE/MATB relocation ñ/scripts/test_suas_offline.sh"
      - name: Verify Windows launchers from unrelated directory
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        env:
          MATB_PYTHON: python
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\MATB relocation ñ\tests\windows\test_matb_launchers.ps1"
          & "$env:GITHUB_WORKSPACE\MATB relocation ñ\tests\windows\test_matb_relocation.ps1"
